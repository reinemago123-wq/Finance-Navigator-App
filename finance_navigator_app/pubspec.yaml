name: finance_navigator
description: Finance Navigator — Personal finance tracker with glassmorphism UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"   # path to your logo file
  adaptive_icon_background: "#091525"     # your app's dark navy colour
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  rename_app: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/